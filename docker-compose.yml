#      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#    depends_on:
#      - agent1
#      - agent2
#    networks:
#      - agents-net

networks:
  agents-net:
    driver: bridge

volumes:
  redis-data:
