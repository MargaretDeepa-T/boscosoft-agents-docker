version: "3.9"

services:
  agent1:
    build: ./agent1
    container_name: boscosoft-agent1
    restart: unless-stopped
    env_file:
      - ./agent1/.env
    ports:
      - "8001:8000"
    networks:
      - agents-net

  agent2:
    build: ./agent2
    container_name: boscosoft-agent2
    restart: unless-stopped
    env_file:
      - ./agent2/.env
    ports:
      - "8002:8000"
    networks:
      - agents-net

