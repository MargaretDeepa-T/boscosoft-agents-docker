events {
    worker_connections 1024;
}

http {
    # ---- Agent 1: Task & Estimation Validation ----
    upstream agent1_upstream {
        server agent1:8000;
    }

    # ---- Agent 2: Timesheet Execution Review ----
    upstream agent2_upstream {
        server agent2:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 1M;   # JSON API requests only

        # Agent 1 routes
        location /agent1/ {
            proxy_pass http://agent1_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Agent 2 routes
        location /agent2/ {
            proxy_pass http://agent2_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Simple root health/info page
        location = / {
            default_type application/json;
            return 200 '{"service":"boscosoft-agents-gateway","routes":["/agent1/","/agent2/"]}';
        }
    }
}
